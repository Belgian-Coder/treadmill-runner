name: TreadmillRunner release validation

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-release:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate release tag
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          if ('${{ github.ref_name }}' -notmatch '^v\d+\.\d+\.\d+$') {
            throw 'Release tags must use vMAJOR.MINOR.PATCH.'
          }
      - name: Restore locked dependencies
        shell: pwsh
        run: dotnet restore TreadmillRunner.slnx --locked-mode
      - name: Validate release
        shell: pwsh
        run: ./eng/validate.ps1 -Configuration Release
      - name: Browser acceptance
        shell: pwsh
        run: ./eng/playwright.ps1 -Configuration Release -InstallBrowsers -Filter 'Category=Browser&Category!=Performance'
