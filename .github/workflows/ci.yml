name: TreadmillRunner release validation

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: Release version to validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-release:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate release tag
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          if ('${{ github.ref_name }}' -notmatch '^v\d+\.\d+\.\d+$') {
            throw 'Release tags must use vMAJOR.MINOR.PATCH.'
          }
      - name: Restore pinned dependency graph
        shell: pwsh
        run: dotnet restore TreadmillRunner.slnx --force-evaluate --no-http-cache
      - name: Validate release
        shell: pwsh
        run: ./eng/validate.ps1 -Configuration Release
      - name: Validate offline release contents
        shell: pwsh
        run: |
          $version = if ('${{ github.event_name }}' -eq 'push') { '${{ github.ref_name }}'.TrimStart('v') } else { '${{ inputs.version }}' }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Release versions must use MAJOR.MINOR.PATCH.' }
          ./eng/publish-release.ps1 -Version $version
      - name: Browser acceptance
        shell: pwsh
        run: ./eng/playwright.ps1 -Configuration Release -InstallBrowsers -Filter 'Category=Browser&Category!=Performance'
