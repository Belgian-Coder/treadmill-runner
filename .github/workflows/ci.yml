name: TreadmillRunner CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Restore and lock
        shell: pwsh
        run: dotnet restore TreadmillRunner.slnx --use-lock-file --force-evaluate
      - name: Validate
        shell: pwsh
        run: ./eng/validate.ps1 -Configuration Release

  browser:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore and lock
        shell: pwsh
        run: dotnet restore TreadmillRunner.slnx --use-lock-file --force-evaluate
      - name: Browser acceptance
        shell: pwsh
        run: ./eng/playwright.ps1 -Configuration Release -InstallBrowsers -Filter 'Category=Browser&Category!=Performance'
